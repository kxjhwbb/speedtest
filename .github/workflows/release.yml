name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev zlib1g-dev libzstd-dev

      - name: Compile Static Binary
        run: |
          gcc -O3 -flto -fomit-frame-pointer -Wall speedtest.c -o bb-speedtest-linux-x86_64 -static -lssl -lcrypto -lz -lzstd -lpthread -ldl
          strip bb-speedtest-linux-x86_64
          chmod +x bb-speedtest-linux-x86_64
          file bb-speedtest-linux-x86_64
          ls -lh bb-speedtest-linux-x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-speedtest-linux-x86_64
          path: bb-speedtest-linux-x86_64

  build-linux-cross:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-linux-gnu
            cross_pkg: gcc-aarch64-linux-gnu
            cflags: "-O3 -flto -fomit-frame-pointer -march=armv8-a+crypto+crc"
          - arch: armhf
            target: arm-linux-gnueabihf
            cross_pkg: gcc-arm-linux-gnueabihf
            cflags: "-O3 -flto -fomit-frame-pointer -march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard"
          - arch: armel
            target: arm-linux-gnueabi
            cross_pkg: gcc-arm-linux-gnueabi
            cflags: "-O3 -flto -fomit-frame-pointer -march=armv5te"
          - arch: mipsel
            target: mipsel-linux-gnu
            cross_pkg: gcc-mipsel-linux-gnu
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: mips
            target: mips-linux-gnu
            cross_pkg: gcc-mips-linux-gnu
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: riscv64
            target: riscv64-linux-gnu
            cross_pkg: gcc-riscv64-linux-gnu
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: i686
            target: i686-linux-gnu
            cross_pkg: gcc-i686-linux-gnu
            cflags: "-O3 -flto -fomit-frame-pointer -m32"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Cross Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ${{ matrix.cross_pkg }}

      - name: Build Static OpenSSL for Target Architecture
        run: |
          # 快速克隆精简版 OpenSSL 源码并针对目标架构做极速静态构建 (约 30-40 秒)
          git clone --depth 1 -b openssl-3.2 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          
          # 根据 target 映射 OpenSSL Configure 平台名
          OPENSSL_ARCH=""
          case "${{ matrix.arch }}" in
            aarch64) OPENSSL_ARCH="linux-aarch64" ;;
            armhf)   OPENSSL_ARCH="linux-armv4 -march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard" ;;
            armel)   OPENSSL_ARCH="linux-armv4" ;;
            mipsel)  OPENSSL_ARCH="linux-mips32" ;;
            mips)    OPENSSL_ARCH="linux-mips32" ;;
            riscv64) OPENSSL_ARCH="linux64-riscv64" ;;
            i686)    OPENSSL_ARCH="linux-x86" ;;
          esac

          ./Configure ${OPENSSL_ARCH} \
            --cross-compile-prefix=${{ matrix.target }}- \
            no-shared no-tests no-docs no-legacy no-engine no-ui-console \
            --prefix=$GITHUB_WORKSPACE/openssl-target \
            --openssldir=$GITHUB_WORKSPACE/openssl-target

          make -j$(nproc) build_libs
          make install_dev
          cd ..

      - name: Compile Static bb-speedtest Binary
        run: |
          ${{ matrix.target }}-gcc ${{ matrix.cflags }} -Wall \
            -I$GITHUB_WORKSPACE/openssl-target/include \
            -L$GITHUB_WORKSPACE/openssl-target/lib \
            -L$GITHUB_WORKSPACE/openssl-target/lib64 \
            speedtest.c -o bb-speedtest-linux-${{ matrix.arch }} \
            -static -lssl -lcrypto -lpthread -ldl

          ${{ matrix.target }}-strip bb-speedtest-linux-${{ matrix.arch }} || true
          chmod +x bb-speedtest-linux-${{ matrix.arch }}
          file bb-speedtest-linux-${{ matrix.arch }}
          ls -lh bb-speedtest-linux-${{ matrix.arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-speedtest-linux-${{ matrix.arch }}
          path: bb-speedtest-linux-${{ matrix.arch }}

  build-macos:
    name: Build macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install OpenSSL
        run: |
          brew install openssl@3

      - name: Compile macOS Binary
        run: |
          OPENSSL_DIR=$(brew --prefix openssl@3)
          clang -O3 -Wall \
            -I${OPENSSL_DIR}/include \
            -L${OPENSSL_DIR}/lib \
            speedtest.c -o bb-speedtest-darwin-${{ matrix.arch }} \
            -lssl -lcrypto -lpthread -lz

          strip bb-speedtest-darwin-${{ matrix.arch }} || true
          chmod +x bb-speedtest-darwin-${{ matrix.arch }}
          file bb-speedtest-darwin-${{ matrix.arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-speedtest-darwin-${{ matrix.arch }}
          path: bb-speedtest-darwin-${{ matrix.arch }}

  release:
    name: Create GitHub Release
    needs: [build-linux-x86_64, build-linux-cross, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Organize Release Assets
        run: |
          mkdir -p release_files
          find dist -type f -name "bb-speedtest-*" -exec cp {} release_files/ \;
          cd release_files
          sha256sum * > sha256sums.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          draft: false
          prerelease: false
          generate_release_notes: true
