name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev zlib1g-dev libzstd-dev

      - name: Compile Static Binary
        run: |
          gcc -O3 -flto -fomit-frame-pointer -Wall speedtest.c -o bb-speedtest-linux-x86_64 -static -lssl -lcrypto -latomic -lz -lzstd -lpthread -ldl
          strip bb-speedtest-linux-x86_64
          chmod +x bb-speedtest-linux-x86_64
          file bb-speedtest-linux-x86_64
          ls -lh bb-speedtest-linux-x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-speedtest-linux-x86_64
          path: bb-speedtest-linux-x86_64

  build-linux-cross:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-linux-gnu
            cross_pkg: gcc-aarch64-linux-gnu
            openssl_target: linux-aarch64
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: armhf
            target: arm-linux-gnueabihf
            cross_pkg: gcc-arm-linux-gnueabihf
            openssl_target: linux-armv4
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: armel
            target: arm-linux-gnueabi
            cross_pkg: gcc-arm-linux-gnueabi
            openssl_target: linux-armv4
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: mipsel
            target: mipsel-linux-gnu
            cross_pkg: gcc-mipsel-linux-gnu
            openssl_target: linux-mips32
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: mips
            target: mips-linux-gnu
            cross_pkg: gcc-mips-linux-gnu
            openssl_target: linux-mips32
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: riscv64
            target: riscv64-linux-gnu
            cross_pkg: gcc-riscv64-linux-gnu
            openssl_target: linux64-riscv64
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: i686
            target: i686-linux-gnu
            cross_pkg: gcc-i686-linux-gnu
            openssl_target: linux-x86
            cflags: "-O3 -flto -fomit-frame-pointer -m32"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Cross Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ${{ matrix.cross_pkg }}

      - name: Build Static OpenSSL for Target Architecture
        run: |
          git clone --depth 1 -b openssl-3.2 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src

          ./Configure ${{ matrix.openssl_target }} \
            --cross-compile-prefix=${{ matrix.target }}- \
            no-shared no-tests no-docs no-legacy no-engine no-ui-console no-asm \
            --prefix=$GITHUB_WORKSPACE/openssl-target \
            --openssldir=$GITHUB_WORKSPACE/openssl-target

          make -j$(nproc) build_libs
          make install_dev
          cd ..

      - name: Compile Static bb-speedtest Binary
        run: |
          ${{ matrix.target }}-gcc ${{ matrix.cflags }} -Wall \
            -I$GITHUB_WORKSPACE/openssl-target/include \
            -L$GITHUB_WORKSPACE/openssl-target/lib \
            -L$GITHUB_WORKSPACE/openssl-target/lib64 \
            speedtest.c -o bb-speedtest-linux-${{ matrix.arch }} \
            -static -lssl -lcrypto -latomic -lpthread -ldl

          ${{ matrix.target }}-strip bb-speedtest-linux-${{ matrix.arch }} || true
          chmod +x bb-speedtest-linux-${{ matrix.arch }}
          file bb-speedtest-linux-${{ matrix.arch }}
          ls -lh bb-speedtest-linux-${{ matrix.arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-speedtest-linux-${{ matrix.arch }}
          path: bb-speedtest-linux-${{ matrix.arch }}

  build-macos:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install OpenSSL
        run: |
          brew install openssl@3

      - name: Compile macOS Binary
        run: |
          OPENSSL_DIR=$(brew --prefix openssl@3)
          clang -O3 -Wall \
            -I"${OPENSSL_DIR}/include" \
            -L"${OPENSSL_DIR}/lib" \
            speedtest.c -o bb-speedtest-darwin-arm64 \
            -lssl -lcrypto -lpthread -lz

          strip bb-speedtest-darwin-arm64 || true
          chmod +x bb-speedtest-darwin-arm64
          file bb-speedtest-darwin-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-speedtest-darwin-arm64
          path: bb-speedtest-darwin-arm64

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-w64-mingw32
            openssl_target: mingw64
          - arch: arm64
            target: aarch64-w64-mingw32
            openssl_target: mingw-arm64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup LLVM MinGW
        uses: mstorsjo/setup-llvm-mingw@v3
        with:
          target: ${{ matrix.target }}

      - name: Build Static OpenSSL for Windows
        run: |
          git clone --depth 1 -b openssl-3.2 https://github.com/openssl/openssl.git openssl-win
          cd openssl-win

          ./Configure ${{ matrix.openssl_target }} \
            --cross-compile-prefix=${{ matrix.target }}- \
            no-shared no-tests no-docs no-legacy no-engine no-ui-console no-asm \
            --prefix=$GITHUB_WORKSPACE/openssl-target \
            --openssldir=$GITHUB_WORKSPACE/openssl-target

          make -j$(nproc) build_libs
          make install_dev
          cd ..

      - name: Compile Static Windows Binary
        run: |
          ${{ matrix.target }}-clang -O3 -flto -fomit-frame-pointer -Wall \
            -I$GITHUB_WORKSPACE/openssl-target/include \
            -L$GITHUB_WORKSPACE/openssl-target/lib \
            -L$GITHUB_WORKSPACE/openssl-target/lib64 \
            speedtest.c -o bb-speedtest-windows-${{ matrix.arch }}.exe \
            -static -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lbcrypt -lpthread

          ${{ matrix.target }}-strip bb-speedtest-windows-${{ matrix.arch }}.exe || true
          chmod +x bb-speedtest-windows-${{ matrix.arch }}.exe
          file bb-speedtest-windows-${{ matrix.arch }}.exe
          ls -lh bb-speedtest-windows-${{ matrix.arch }}.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-speedtest-windows-${{ matrix.arch }}.exe
          path: bb-speedtest-windows-${{ matrix.arch }}.exe

  release:
    name: Create GitHub Release
    needs: [build-linux-x86_64, build-linux-cross, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Organize Release Assets
        run: |
          mkdir -p release_files
          find dist -type f -name "bb-speedtest-*" -exec cp {} release_files/ \;
          cd release_files
          sha256sum * > sha256sums.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          draft: false
          prerelease: false
          generate_release_notes: true
